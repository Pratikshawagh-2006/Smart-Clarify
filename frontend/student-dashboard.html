<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student dashboard · SmartClarify</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="page-head">
            <h1>Your doubts</h1>
            <p>Ask a question, then come back here to read the teacher's answer.</p>
        </header>

        <section class="stats" id="stats"></section>
        
        <!-- Analytics Section Added -->
        <section class="stats" id="student-analytics" style="margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;"></section>

        <div class="grid-2">
            <section class="card ask-card" id="ask">
                <h2>Ask a doubt</h2>
                <p class="hint">Be specific. Clear questions get faster answers.</p>
                <form id="ask-form">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" maxlength="100" list="subject-list" placeholder="e.g. Data Structures" required>
                    <datalist id="subject-list"></datalist>

                    <label for="question">Your question</label>
                    <textarea id="question" placeholder="What are you stuck on? Mention the topic, and what you've already tried." required></textarea>

                    <button type="submit" class="primary">Send question</button>
                    <div class="message" id="ask-message"></div>
                </form>
            </section>

            <section id="questions">
                <div class="section-head">
                    <h2>My questions</h2>
                    <div class="chips" id="chips"></div>
                </div>
                <div id="my-questions"></div>
            </section>
        </div>
    </main>
</div>

<button type="button" class="chat-fab" id="chat-fab" aria-label="Open AI assistant">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Ask AI
</button>

<section class="chat-panel" id="chat-panel" aria-label="AI assistant">
    <div class="chat-head">
        <div><strong>SmartClarify AI</strong><small>Unsure questions go to your teacher</small></div>
        <button type="button" class="chat-close" id="chat-close" aria-label="Close chat">&times;</button>
    </div>
    <div class="chat-subject"><input type="text" id="chat-subject" maxlength="100" placeholder="Subject (optional), e.g. Data Structures"></div>
    <div class="chat-body" id="chat-body"></div>
    <form class="chat-form" id="chat-form">
        <textarea id="chat-input" placeholder="Type your doubt..." required></textarea>
        <button type="submit" id="chat-send">Send</button>
    </form>
</section>

<script src="dashboard.js"></script>
<script>
if (requireRole("student")) {
    buildShell("Student", [
        { href: "#ask", icon: "ask", label: "Ask a doubt" },
        { href: "#questions", icon: "list", label: "My questions" }
    ]);

    const me = currentUser();
    let all = [];
    let filter = "all";

    const isAwaiting = q => q.status === "pending" || q.status === "escalated";
    const isAnswered = q => q.status === "resolved" || q.status === "auto_resolved";

    function renderStats() {
        document.getElementById("stats").innerHTML =
            statCard("message", "", all.length, "Questions asked") +
            statCard("clock", "amber", all.filter(isAwaiting).length, "Waiting for a reply") +
            statCard("check", "green", all.filter(isAnswered).length, "Answered");
    }

    async function loadAnalytics() {
        try {
            const data = await api(`/student/analytics/${me.id}`);
            document.getElementById("student-analytics").innerHTML =
                statCard("chart", "blue", data.total_doubts, "Total Doubts") +
                statCard("check", "green", data.auto_resolved_by_ai, "AI Resolved") +
                statCard("check", "green", data.resolved_by_teachers, "Teacher Resolved") +
                statCard("clock", "amber", data.pending_doubts, "Pending Doubts");
        } catch (e) {
            console.error("Failed to load analytics", e);
        }
    }

    function renderChips() {
        const opts = [
            ["all", "All", all.length],
            ["awaiting", "Waiting", all.filter(isAwaiting).length],
            ["answered", "Answered", all.filter(isAnswered).length]
        ];
        document.getElementById("chips").innerHTML = opts.map(([key, label, n]) =>
            `<button type="button" class="chip ${filter === key ? "active" : ""}" data-filter="${key}">${label}<span class="n">${n}</span></button>`
        ).join("");
    }

    function renderList() {
        const box = document.getElementById("my-questions");
        const list = all.filter(q => filter === "all" ? true : filter === "awaiting" ? isAwaiting(q) : isAnswered(q));

        if (!all.length) {
            box.innerHTML = `<div class="empty"><strong>No questions yet</strong>Use the form to ask your first doubt.</div>`;
            return;
        }
        if (!list.length) {
            box.innerHTML = `<div class="empty"><strong>Nothing here</strong>No questions match this filter.</div>`;
            return;
        }

        box.innerHTML = list.map(q => {
            let tail;
            if (q.answer_text) {
                tail = `<div class="answer">
                            <div class="answer-by"><span class="mini">T</span>Teacher's answer</div>
                            <p>${esc(q.answer_text)}</p>
                        </div>`;
            } else if (q.ai_answer) {
                tail = `<div class="answer ai-answer">
                            <div class="answer-by"><span class="mini">AI</span>AI answer</div>
                            <p>${esc(q.ai_answer)}</p>
                        </div>`;
            } else if (q.status === "escalated") {
                tail = `<div class="waiting">${icon("alert")}Forwarded to a teacher. They will reply here.</div>`;
            } else {
                tail = `<div class="waiting">${icon("clock")}Waiting for a teacher to reply.</div>`;
            }
            return `<article class="q-card s-${esc(q.status)}">
                        <div class="q-head"><span class="q-subject">${esc(q.subject)}</span>${badge(q.status)}</div>
                        <p class="q-text">${esc(q.question_text)}</p>
                        ${tail}
                    </article>`;
        }).join("");
    }

    function renderSubjects() {
        const subjects = [...new Set(all.map(q => q.subject).filter(Boolean))];
        document.getElementById("subject-list").innerHTML = subjects.map(s => `<option value="${esc(s)}">`).join("");
    }

    function renderAll() { renderStats(); renderChips(); renderList(); renderSubjects(); loadAnalytics(); }

    async function loadQuestions() {
        try {
            all = await api(`/student/questions/${me.id}`);
            renderAll();
        } catch (e) {
            document.getElementById("my-questions").innerHTML = `<div class="message error">${esc(e.message)}</div>`;
        }
    }

    document.getElementById("chips").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-filter]");
        if (!btn) return;
        filter = btn.dataset.filter;
        renderChips();
        renderList();
    });

    document.getElementById("ask-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("ask-message");
        msg.className = "message";
        try {
            await api("/student/questions", "POST", {
                student_id: me.id,
                subject: document.getElementById("subject").value.trim(),
                question_text: document.getElementById("question").value.trim()
            });
            toast("Question sent");
            e.target.reset();
            loadQuestions();
        } catch (err) {
            msg.textContent = err.message;
            msg.className = "message error";
        }
    });

    /* ---------- AI chat widget ---------- */
    const chatPanel = document.getElementById("chat-panel");
    const chatBody = document.getElementById("chat-body");
    const chatInput = document.getElementById("chat-input");
    const chatSend = document.getElementById("chat-send");
    let chatHistory = [];

    function addMsg(kind, text) {
        const d = document.createElement("div");
        d.className = "msg " + kind;
        d.textContent = text;
        chatBody.appendChild(d);
        chatBody.scrollTop = chatBody.scrollHeight;
        return d;
    }

    function toggleChat(open) {
        chatPanel.classList.toggle("open", open);
        if (open) {
            if (!chatBody.children.length) addMsg("ai", "Hi! Ask me any doubt. If I'm not sure, I'll forward it to a teacher.");
            chatInput.focus();
        }
    }
    document.getElementById("chat-fab").addEventListener("click", () => toggleChat(!chatPanel.classList.contains("open")));
    document.getElementById("chat-close").addEventListener("click", () => toggleChat(false));

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chat-form").requestSubmit(); }
    });

    document.getElementById("chat-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        addMsg("user", text);
        chatInput.value = "";
        chatSend.disabled = true;
        const typing = addMsg("ai typing", "Thinking...");

        try {
            const res = await api("/student/chat", "POST", {
                student_id: me.id,
                subject: document.getElementById("chat-subject").value.trim() || "General",
                question_text: text,
                history: chatHistory.slice(-6)
            });
            typing.remove();
            chatHistory.push({ role: "user", text });
            
            if (res.route === "ai" || res.route === "duplicate") {
                addMsg("ai", res.answer);
                if (res.route === "ai") {
                    chatHistory.push({ role: "ai", text: res.answer });
                }
            } else {
                addMsg("note", res.message);
            }
            loadQuestions();
        } catch (err) {
            typing.remove();
            addMsg("note", err.message);
        } finally {
            chatSend.disabled = false;
            chatInput.focus();
        }
    });

    loadQuestions();
}
</script>
</body>
</html>
